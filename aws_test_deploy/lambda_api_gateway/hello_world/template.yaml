# AWS SAM Template - Hello World Lambda
# SEN TAMAMLAYACAKSIN!

# SAM Template Yapısı:
# - AWSTemplateFormatVersion: CloudFormation versiyonu
# - Transform: SAM kullanıyoruz
# - Description: Ne yaptığını açıkla
# - Globals: Tüm fonksiyonlar için ortak ayarlar
# - Resources: AWS kaynakları (Lambda, API Gateway, vb.)
# - Outputs: Deploy sonrası bilgiler

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Hello World Lambda - AWS Öğrenme Egzersizi

# TODO 1: Global ayarları tamamla
Globals:
  Function:
    Timeout: # SENİN KODUN - kaç saniye? (3-30 arası)
    Runtime: # SENİN KODUN - python3.9 veya python3.11
    MemorySize: # SENİN KODUN - MB cinsinden (128, 256, 512, vb.)
    Architectures:
      - arm64  # Apple Silicon uyumlu

Resources:
  # TODO 2: Lambda fonksiyonunu tanımla
  HelloWorldFunction:
    Type: AWS::Serverless::Function
    Properties:
      # CodeUri: Lambda kodunun bulunduğu klasör
      CodeUri: # SENİN KODUN - "." kullanabilirsin
      
      # Handler: dosya_adı.fonksiyon_adı formatında
      # Örnek: app.lambda_handler -> app.py dosyasındaki lambda_handler fonksiyonu
      Handler: # SENİN KODUN
      
      Description: "Hello World Lambda fonksiyonu"
      
      # TODO 3: API Gateway event'ini tanımla
      Events:
        HelloWorldApi:
          Type: Api
          Properties:
            Path: # SENİN KODUN - /hello gibi bir path
            Method: # SENİN KODUN - get, post, vb.

# TODO 4: Output'ları tamamla
Outputs:
  HelloWorldApi:
    Description: "API Gateway endpoint URL"
    Value: # SENİN KODUN - !Sub kullanarak URL oluştur
    # İpucu: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/hello"
    
  HelloWorldFunction:
    Description: "Lambda Function ARN"
    Value: # SENİN KODUN - !GetAtt kullanarak ARN al
    # İpucu: !GetAtt HelloWorldFunction.Arn
