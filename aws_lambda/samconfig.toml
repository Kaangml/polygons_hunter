# SAM CLI Configuration File
# https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-cli-config.html

version = 0.1

[default.deploy.parameters]
stack_name = "polygon-hunter-api"
region = "eu-central-1"
confirm_changeset = false
capabilities = "CAPABILITY_IAM"
parameter_overrides = "Environment=dev S3BucketName=polygons-hunter-data"
disable_rollback = false

[default.build.parameters]
use_container = false

[dev.deploy.parameters]
stack_name = "polygon-hunter-api-dev"
region = "eu-central-1"
confirm_changeset = false
capabilities = "CAPABILITY_IAM"
parameter_overrides = "Environment=dev S3BucketName=polygons-hunter-data"

[prod.deploy.parameters]
stack_name = "polygon-hunter-api-prod"
region = "eu-central-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
parameter_overrides = "Environment=prod S3BucketName=polygons-hunter-data"
